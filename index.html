<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আস্থা সমিতি</title>
<style>
:root{--red:#b91c1c;--bg:#f5f5f5;--ink:#202020;--line:#e4e4e7;--teal:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:var(--ink)}
header{background:#fff;padding:15px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:12px}
.logo{width:80px;height:80px}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{font-size:20px;font-weight:800;color:var(--red)}
main{padding:10px}
.panel{background:#fff;padding:12px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line)}
.customer{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.cust-info{font-size:14px}
.cust-info b{font-size:16px;display:block}
.cust-details{display:none;background:#f9f9f9;padding:10px;margin-top:8px;border-radius:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
<div class="head">
<div class="logo"><img src="40679.png" alt="Logo"></div>
<div><div class="brand">আস্থা সমিতি</div></div>
</div>
</header>
<main>
<section id="app">
<div class="panel">
<h3>গ্রাহক তালিকা</h3>
<div id="customerList">
<div class="customer" onclick="toggleDetails('c1')">
<div class="cust-info"><b>F G Rofik</b><small>019-611-77109</small></div>
<div id="c1" class="cust-details">লোন: ১০,০০০৳
মেয়াদ: ১২ সপ্তাহ</div>
</div>
</div>
</div>
</section>
</main>
<script>
function toggleDetails(id){document.getElementById(id).classList.toggle('hidden')}
</script>
</body>
</html>

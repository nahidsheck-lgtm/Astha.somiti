<style>
:root{--red:#b91c1c;--red2:#7f1d1d;--black:#0f766e;--bg:#f5f5f5;--ink:#202020;--muted:#666;--line:#e4e4e7;--soft:#fff1f1;--teal:#0f766e;--teal2:#14b8a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--ink);padding-bottom:78px}
header{background:#ffffff;color:#202020;padding:20px 16px 24px;border-radius:0 0 22px 22px;border-bottom:1px solid #e4e4e7}
.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:800}.sub{font-size:12px;opacity:.85;margin-top:3px}
.logo{width:68px;height:68px;flex:0 0 68px;border:1px solid #ffffff70;border-radius:18px;display:grid;place-items:center;background:#ffffff18;overflow:hidden}.logo svg{width:100%;height:100%}.schedule-watermark svg{width:100%;height:100%}.step-indicator{display:flex;gap:7px;margin:0 0 14px}.step-indicator span{height:5px;flex:1;border-radius:9px;background:#e5e5e5}.step-indicator span.on{background:var(--red)}.field-action{display:flex;gap:7px;align-items:end}.field-action input{flex:1}.field-action button{white-space:nowrap;padding:10px}.step-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.step-actions>*{flex:1}
main{max-width:900px;margin:18px auto;padding:0 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 5px 20px #1717170d}
h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px;border-radius:13px;background:var(--soft)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:22px;margin-top:4px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d4d4d8;border-radius:10px;font:inherit;background:#e5e7eb;border:1.5px solid #737373;color:#111827;min-height:44px}
input:focus,select:focus{outline:2px solid #fca5a5;border-color:var(--red)}
button,.btn{border:0;border-radius:11px;background:var(--red);color:white;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button.secondary,.btn.secondary{background:#eee;color:#222}button.danger{background:#fff0ef;color:#991b1b}button.whatsapp{background:#128c52}button.amber{background:#fef3c7;color:#92400e}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}.customer{border:1px solid var(--line);padding:13px;border-radius:13px;margin:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.customer b{display:block}.customer small{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}th{background:#f8eeee;color:#6f1d1d}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.pill{font-size:11px;background:#fee2e2;color:#991b1b;padding:4px 8px;border-radius:20px}.due-row{background:#fff0f0;color:#991b1b}.due-row td{border-bottom-color:#fecaca}.due-badge{display:inline-block;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:20px;padding:4px 8px;font-weight:800;font-size:11px}.paid-badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:4px 8px;font-weight:800;font-size:11px}.future-badge{display:inline-block;background:#f3f4f6;color:#555;border-radius:20px;padding:4px 8px;font-weight:700;font-size:11px}.notice{background:#fff8e6;border:1px solid #f1dfad;padding:12px;border-radius:12px;font-size:12px;line-height:1.55}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}nav button{flex:1;background:#eee;color:#222;padding:10px 8px;font-size:13px}nav button.active{background:var(--black);color:#fff}
.app-footer-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(110deg,var(--teal),var(--teal2));border-top:1px solid #0d9488;padding:8px 5px;display:flex;justify-content:space-around;align-items:center;z-index:1000;box-shadow:0 -4px 15px #00000020}
.app-footer-nav button{background:transparent;color:#ecfeff;font-size:11px;font-weight:650;padding:6px 5px;min-height:auto;flex-direction:column;gap:3px}.app-footer-nav button.active{color:#ffffff;background:#ffffff24;border-radius:13px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}}
@media print{header,nav,.app-footer-nav,.no-print{display:none!important}body{background:white;padding:0}.panel{box-shadow:none;border:0;padding:0}}

input:focus, textarea:focus, select:focus,
input:active, textarea:active, select:active {
  background:#fff !important; color:#111827 !important;
  border-color:#2563eb !important; outline:2px solid #bfdbfe;
}
.paid-row { background:#dcfce7 !important; color:#166534 !important; }
.due-row { background:#fee2e2 !important; color:#991b1b !important; }
.paid-row td, .due-row td { border-color:#fecaca; }

/* Input focus state: gray when idle, white only while editing. */
input,textarea,select{background:#e5e7eb!important;border:1.5px solid #737373!important;color:#111827!important;transition:background .12s ease,border-color .12s ease}
input:focus,textarea:focus,select:focus{background:#fff!important;color:#111827!important;border-color:#b91c1c!important;outline:2px solid #fecaca!important}
input::placeholder,textarea::placeholder{color:#6b7280}
.paid-row{background:#dcfce7!important;color:#166534!important}
.due-row{background:#fee2e2!important;color:#991b1b!important}
.paid-row td,.due-row td{border-color:#fecaca!important}
.schedule-shell{position:relative;isolation:isolate;overflow:hidden;border-radius:14px;margin:10px 0 16px}
.schedule-shell .schedule-watermark{position:absolute;z-index:0;left:50%;top:52%;width:min(64vw,310px);height:min(64vw,310px);transform:translate(-50%,-50%);opacity:.13;pointer-events:none}
.schedule-shell .tablewrap{position:relative;z-index:1}

.schedule-total{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff1f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:800}
.notice-actions{display:flex;gap:7px;flex-wrap:wrap}
.notice-actions button{flex:1;min-width:85px;font-size:12px;padding:9px 7px}
#tabTrash{min-width:78px;white-space:normal;line-height:1.15}
#quickNoticeEdit{box-shadow:0 2px 8px #0002}
#quickNoticeEdit:active{background:#fff!important;color:#991b1b!important}
.logo img{display:block}
@media(max-width:420px){#quickNoticeEdit{font-size:11px;padding:6px 7px}.brand{font-size:21px}}
